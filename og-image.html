<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=630">
    <title>OG Image - Флаер Гусев</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 60px;
        }
        .logo {
            font-size: 72px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 48px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 28px;
            color: #a0aec0;
            text-align: center;
            margin-bottom: 40px;
        }
        .features {
            display: flex;
            gap: 40px;
            margin-top: 20px;
        }
        .feature {
            text-align: center;
        }
        .feature-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .feature-text {
            font-size: 20px;
            color: #e2e8f0;
        }
        .url {
            position: absolute;
            bottom: 40px;
            font-size: 24px;
            color: #64748b;
        }
        .badge {
            position: absolute;
            top: 40px;
            right: 40px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">🛒 Каталог</div>
        <div class="logo">🏪</div>
        <h1>Флаер Гусев</h1>
        <div class="subtitle">Каталог магазинов и товаров города Гусев</div>
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🪑</div>
                <div class="feature-text">Мебель</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🍎</div>
                <div class="feature-text">Продукты</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔨</div>
                <div class="feature-text">Стройматериалы</div>
            </div>
            <div class="feature">
                <div class="feature-icon">👗</div>
                <div class="feature-text">Одежда</div>
            </div>
        </div>
        <div class="url">gusev-flyer.ru</div>
    </div>
</body>
</html>
