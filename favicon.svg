<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Тело лося -->
  <ellipse cx="50" cy="60" rx="25" ry="20" fill="url(#grad)"/>
  
  <!-- Шея -->
  <rect x="42" y="35" width="16" height="25" rx="8" fill="url(#grad)"/>
  
  <!-- Голова -->
  <ellipse cx="50" cy="30" rx="15" ry="12" fill="url(#grad)"/>
  
  <!-- Рога -->
  <path d="M35 25 L25 15 M35 25 L30 12 M65 25 L75 15 M65 25 L70 12" 
        stroke="#8B4513" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Уши -->
  <ellipse cx="35" cy="22" rx="5" ry="8" fill="#8B4513"/>
  <ellipse cx="65" cy="22" rx="5" ry="8" fill="#8B4513"/>
  
  <!-- Глаза -->
  <circle cx="43" cy="28" r="3" fill="white"/>
  <circle cx="57" cy="28" r="3" fill="white"/>
  <circle cx="44" cy="28" r="1.5" fill="black"/>
  <circle cx="58" cy="28" r="1.5" fill="black"/>
  
  <!-- Нос -->
  <ellipse cx="50" cy="35" rx="4" ry="3" fill="#654321"/>
  
  <!-- Ноги -->
  <rect x="35" y="75" width="6" height="15" rx="3" fill="url(#grad)"/>
  <rect x="59" y="75" width="6" height="15" rx="3" fill="url(#grad)"/>
  
  <!-- Копыта -->
  <ellipse cx="38" cy="92" rx="5" ry="3" fill="#654321"/>
  <ellipse cx="62" cy="92" rx="5" ry="3" fill="#654321"/>
  
  <!-- Задние ноги -->
  <rect x="32" y="70" width="5" height="18" rx="2.5" fill="url(#grad)"/>
  <rect x="63" y="70" width="5" height="18" rx="2.5" fill="url(#grad)"/>
  
  <!-- Хвост -->
  <ellipse cx="25" cy="55" rx="4" ry="6" fill="#8B4513"/>
  
  <!-- Рога (более детальные) -->
  <path d="M32 22 L22 8 M22 8 L18 5 M22 8 L26 5" 
        stroke="#8B4513" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M68 22 L78 8 M78 8 L82 5 M78 8 L74 5" 
        stroke="#8B4513" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
