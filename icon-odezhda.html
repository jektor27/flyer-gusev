<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 500px; height: 500px; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
        .icon {
            width: 500px; height: 500px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 3px solid rgba(139, 92, 246, 0.4);
            border-radius: 40px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        }
        .emoji { font-size: 160px; filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3)); }
        .label { font-size: 48px; font-weight: 700; color: #8b5cf6; }
    </style>
</head>
<body>
    <div class="icon">
        <div class="emoji">👗</div>
        <div class="label">Одежда</div>
    </div>
</body>
</html>
