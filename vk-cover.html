<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1590">
    <title>Обложка ВК — ФлаерГусев</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 1590px;
            height: 530px;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        .cover {
            width: 1590px;
            height: 530px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Сетка на фоне */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(51, 65, 85, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(51, 65, 85, 0.2) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.4;
        }
        
        /* Декоративные круги */
        .circle-1 {
            position: absolute;
            top: -80px;
            left: 100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        
        .circle-2 {
            position: absolute;
            bottom: -100px;
            right: 200px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }
        
        /* Основной контент — по центру */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 1200px;
        }
        
        /* Бейдж сверху */
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 10px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        
        /* Лого */
        .logo {
            font-size: 80px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -2px;
        }
        
        .logo .flyer {
            color: #ffffff;
        }
        
        .logo .gusev {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Подзаголовок */
        .subtitle {
            font-size: 28px;
            color: #94a3b8;
            margin-bottom: 36px;
            font-weight: 400;
        }
        
        /* Иконки категорий — по центру */
        .categories {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 36px;
        }
        
        .cat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .cat-icon {
            width: 70px;
            height: 70px;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid #334155;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        
        .cat-name {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }
        
        /* Контакты и лось — в одну строку */
        .bottom-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
        }
        
        .contacts {
            display: flex;
            gap: 40px;
            font-size: 18px;
            color: #64748b;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .contact-item span {
            color: #10b981;
        }
        
        /* Лось */
        .moose {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        
        .moose-circle {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.25) 0%, rgba(139, 92, 246, 0.25) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .moose-icon {
            font-size: 70px;
        }
        
        .stats {
            display: flex;
            gap: 32px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: 800;
            color: #fbbf24;
        }
        
        .stat-label {
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="cover">
        <div class="grid-bg"></div>
        <div class="circle-1"></div>
        <div class="circle-2"></div>
        
        <div class="content">
            <div class="badge">🫎 Символ Гусева</div>
            
            <div class="logo">
                <span class="flyer">Флаер</span><span class="gusev">Гусев</span>
            </div>
            
            <div class="subtitle">Каталог магазинов и товаров города Гусев</div>
            
            <div class="categories">
                <div class="cat-item">
                    <div class="cat-icon">🪑</div>
                    <span class="cat-name">Мебель</span>
                </div>
                <div class="cat-item">
                    <div class="cat-icon">🛒</div>
                    <span class="cat-name">Продукты</span>
                </div>
                <div class="cat-item">
                    <div class="cat-icon">🧱</div>
                    <span class="cat-name">Стройматериалы</span>
                </div>
                <div class="cat-item">
                    <div class="cat-icon">👗</div>
                    <span class="cat-name">Одежда</span>
                </div>
                <div class="cat-item">
                    <div class="cat-icon">💻</div>
                    <span class="cat-name">Техника</span>
                </div>
                <div class="cat-item">
                    <div class="cat-icon">💊</div>
                    <span class="cat-name">Аптеки</span>
                </div>
            </div>
            
            <div class="bottom-row">
                <div class="contacts">
                    <div class="contact-item">
                        <span>🌐</span> gusev-flyer.ru
                    </div>
                    <div class="contact-item">
                        <span>📱</span> +7 (952) 796-57-85
                    </div>
                </div>
                
                <div class="moose">
                    <div class="moose-circle">
                        <div class="moose-icon">🦌</div>
                    </div>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-number">50+</div>
                            <div class="stat-label">Магазинов</div>
                        </div>
                        <div class="stat">
                            <div class="stat-number">8</div>
                            <div class="stat-label">Категорий</div>
                        </div>
                        <div class="stat">
                            <div class="stat-number">28K</div>
                            <div class="stat-label">Жителей</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
