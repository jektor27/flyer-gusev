<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Пункты выдачи Ozon в Гусеве</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: #005bff; color: white; padding: 30px; border-radius: 15px; margin-bottom: 30px; text-align: center; }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .header p { font-size: 18px; opacity: 0.9; }
        .points-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .point-card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.3s ease; border-left: 5px solid #005bff; }
        .point-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0, 95, 255, 0.2); }
        .point-icon { font-size: 48px; margin-bottom: 15px; }
        .point-name { font-size: 22px; font-weight: 700; color: #005bff; margin-bottom: 10px; }
        .point-address { font-size: 16px; color: #666; margin-bottom: 10px; }
        .point-hours { font-size: 14px; color: #005bff; font-weight: 600; background: #e6f0ff; padding: 8px 12px; border-radius: 8px; display: inline-block; }
        .badge { display: inline-block; background: #ff6b00; color: white; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Пункты выдачи Ozon в Гусеве</h1>
            <p>Бесплатная доставка при заказе от 499 рублей</p>
        </div>
        
        <div class="points-grid">
            <div class="point-card">
                <div class="point-icon">🏪</div>
                <div class="point-name">Почта России</div>
                <div class="point-address">📍 ул. Советская, 15</div>
                <div class="point-hours">🕐 Пн-Пт 9:00-19:00, Сб 10:00-16:00</div>
                <div class="badge">Популярный</div>
            </div>
            
            <div class="point-card">
                <div class="point-icon">📦</div>
                <div class="point-name">СДЭК</div>
                <div class="point-address">📍 ул. Ленина, 42</div>
                <div class="point-hours">🕐 Пн-Вс 10:00-20:00</div>
                <div class="badge">Быстро</div>
            </div>
            
            <div class="point-card">
                <div class="point-icon">🏢</div>
                <div class="point-name">BoxBerry</div>
                <div class="point-address">📍 ул. Мира, 8</div>
                <div class="point-hours">🕐 Пн-Пт 9:00-18:00, Сб 10:00-15:00</div>
                <div class="badge">Удобно</div>
            </div>
        </div>
    </div>
</body>
</html>
