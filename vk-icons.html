<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>Иконки категорий — ФлаерГусев</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 1200px;
            background: #0f172a;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 40px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }
        
        .icon-card {
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #334155;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .icon-card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            opacity: 0.15;
        }
        
        .icon-card.furniture::before { background: #f59e0b; }
        .icon-card.food::before { background: #10b981; }
        .icon-card.building::before { background: #ef4444; }
        .icon-card.clothes::before { background: #8b5cf6; }
        .icon-card.tech::before { background: #3b82f6; }
        .icon-card.stationery::before { background: #ec4899; }
        
        .icon-emoji {
            font-size: 100px;
            z-index: 2;
            filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3));
        }
        
        .icon-label {
            font-size: 28px;
            font-weight: 700;
            color: white;
            z-index: 2;
        }
        
        .icon-count {
            font-size: 16px;
            color: #64748b;
            z-index: 2;
        }
        
        .icon-card.furniture { border-color: rgba(245, 158, 11, 0.3); }
        .icon-card.food { border-color: rgba(16, 185, 129, 0.3); }
        .icon-card.building { border-color: rgba(239, 68, 68, 0.3); }
        .icon-card.clothes { border-color: rgba(139, 92, 246, 0.3); }
        .icon-card.tech { border-color: rgba(59, 130, 246, 0.3); }
        .icon-card.stationery { border-color: rgba(236, 72, 153, 0.3); }
    </style>
</head>
<body>
    <div class="grid">
        <div class="icon-card furniture">
            <div class="icon-emoji">🪑</div>
            <div class="icon-label">Мебель</div>
            <div class="icon-count">12 магазинов</div>
        </div>
        
        <div class="icon-card food">
            <div class="icon-emoji">🛒</div>
            <div class="icon-label">Продукты</div>
            <div class="icon-count">25 магазинов</div>
        </div>
        
        <div class="icon-card building">
            <div class="icon-emoji">🧱</div>
            <div class="icon-label">Стройматериалы</div>
            <div class="icon-count">10 магазинов</div>
        </div>
        
        <div class="icon-card clothes">
            <div class="icon-emoji">👗</div>
            <div class="icon-label">Одежда</div>
            <div class="icon-count">15 магазинов</div>
        </div>
        
        <div class="icon-card tech">
            <div class="icon-emoji">💻</div>
            <div class="icon-label">Техника</div>
            <div class="icon-count">8 магазинов</div>
        </div>
        
        <div class="icon-card stationery">
            <div class="icon-emoji">📎</div>
            <div class="icon-label">Канцтовары</div>
            <div class="icon-count">5 магазинов</div>
        </div>
    </div>
</body>
</html>
