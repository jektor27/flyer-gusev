<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=400">
    <title>Аватарка ВК — ФлаерГусев</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 400px;
            height: 400px;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        .avatar {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            overflow: hidden;
        }
        
        /* Фоновый паттерн */
        .pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.08) 0%, transparent 50%);
        }
        
        /* Стилизованный лось — SVG */
        .moose-svg {
            position: relative;
            z-index: 2;
            width: 280px;
            height: 280px;
        }
        
        /* Текст снизу */
        .text-overlay {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 3;
        }
        
        .brand-text {
            font-size: 28px;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            letter-spacing: -1px;
        }
        
        .brand-text .gusev {
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <div class="avatar">
        <div class="pattern"></div>
        
        <!-- Стилизованный лось (SVG) -->
        <svg class="moose-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Рога -->
            <path d="M60 60 Q50 30 30 20 Q25 35 40 50 Q35 40 25 35" 
                  fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
            <path d="M140 60 Q150 30 170 20 Q175 35 160 50 Q165 40 175 35" 
                  fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
            
            <!-- Голова -->
            <ellipse cx="100" cy="100" rx="55" ry="65" fill="#8B4513"/>
            
            <!-- Морда -->
            <ellipse cx="100" cy="120" rx="35" ry="25" fill="#A0522D"/>
            
            <!-- Нос -->
            <ellipse cx="100" cy="115" rx="20" ry="12" fill="#5D3A1A"/>
            <ellipse cx="95" cy="113" rx="4" ry="3" fill="#2d1a0a"/>
            <ellipse cx="105" cy="113" rx="4" ry="3" fill="#2d1a0a"/>
            
            <!-- Глаза -->
            <ellipse cx="78" cy="90" rx="10" ry="12" fill="white"/>
            <ellipse cx="122" cy="90" rx="10" ry="12" fill="white"/>
            <circle cx="80" cy="92" r="6" fill="#1a1a1a"/>
            <circle cx="120" cy="92" r="6" fill="#1a1a1a"/>
            <circle cx="82" cy="90" r="2" fill="white"/>
            <circle cx="122" cy="90" r="2" fill="white"/>
            
            <!-- Уши -->
            <ellipse cx="55" cy="75" rx="12" ry="18" fill="#8B4513" transform="rotate(-20 55 75)"/>
            <ellipse cx="145" cy="75" rx="12" ry="18" fill="#8B4513" transform="rotate(20 145 75)"/>
            <ellipse cx="55" cy="75" rx="7" ry="12" fill="#A0522D" transform="rotate(-20 55 75)"/>
            <ellipse cx="145" cy="75" rx="7" ry="12" fill="#A0522D" transform="rotate(20 145 75)"/>
            
            <!-- Брови -->
            <path d="M68 80 Q78 75 88 80" fill="none" stroke="#5D3A1A" stroke-width="3" stroke-linecap="round"/>
            <path d="M112 80 Q122 75 132 80" fill="none" stroke="#5D3A1A" stroke-width="3" stroke-linecap="round"/>
            
            <!-- Улыбка -->
            <path d="M85 128 Q100 138 115 128" fill="none" stroke="#5D3A1A" stroke-width="3" stroke-linecap="round"/>
            
            <!-- Блики на морде -->
            <ellipse cx="88" cy="108" rx="5" ry="3" fill="rgba(255,255,255,0.2)"/>
            <ellipse cx="112" cy="108" rx="5" ry="3" fill="rgba(255,255,255,0.2)"/>
        </svg>
        
        <div class="text-overlay">
            <div class="brand-text">Флаер<span class="gusev">Гусев</span></div>
        </div>
    </div>
</body>
</html>
